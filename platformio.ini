; esp-lucas - BLE battery monitor for LiFePO4 packs with a bolt-on smart BMS

[env:esp32dev]
platform      = espressif32@^6.9.0
board         = esp32dev
framework     = arduino

monitor_speed = 115200
upload_speed  = 921600

; `time` stamps every line on the host, so console output is easy to correlate
; with whatever else you are watching.
monitor_filters = time, esp32_exception_decoder

; Regenerates include/dashboard_html.h from web/dashboard.html on every build.
extra_scripts = pre:tools/gen_page.py

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
    tzapu/WiFiManager@^2.0.17

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
    -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=517

; Two 1.625 MB app slots for OTA, plus 640 KB of LittleFS for stored history.
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; Over-the-air updates once the board is on WiFi and out of reach of a cable:
;   pio run -e ota -t upload
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = lucas.local
; If mDNS doesn't resolve, override with the board's IP:
;   pio run -e ota -t upload --upload-port 192.168.1.x
